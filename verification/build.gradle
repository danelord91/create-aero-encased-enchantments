plugins { id 'java'; id 'net.neoforged.moddev' version '2.0.140' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
neoForge {
 version = '21.1.265'
 runs {
  gameTestServer { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', 'aero_enchant_compat' }
  client { client(); systemProperty 'mixin.debug.export', 'true' }
 }
 mods { aero_enchant_testharness { sourceSet sourceSets.main } }
}
sourceSets.main.java {
 srcDir '../src/main/java'
 include 'dev/danelord/createaero/testing/**'
 include 'dev/danelord/createaero/testharness/**'
}
repositories {
 mavenCentral()
 maven { url = 'https://maven.createmod.net' }
 maven { url = 'https://mvn.devos.one/snapshots' }
 maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
}
dependencies {
 implementation files('../build/libs/create-aero-enchantment-compat-0.2.1.jar', '../libs/create.jar', '../libs/cem.jar', '../libs/encased.jar')
 implementation 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
 implementation 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
 implementation 'thedarkcolour:kotlinforforge-neoforge:5.9.0'
 compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
 runtimeOnly 'dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6'
}
