plugins { id 'java'; id 'net.neoforged.moddev' version '2.0.140' }
version = '0.2.1'
group = 'dev.danelord.createaero'
base { archivesName = 'create-aero-enchantment-compat' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
neoForge {
 version = '21.1.265'
 runs {
  gameTestServer { type = 'gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces', 'aero_enchant_compat' }
 }
 mods { aero_enchant_compat { sourceSet sourceSets.main } }
}
repositories {
 mavenCentral()
 maven { url = 'https://maven.createmod.net' }
 maven { url = 'https://mvn.devos.one/snapshots' }
 maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
}
dependencies {
 implementation files('libs/create.jar', 'libs/cem.jar', 'libs/encased.jar')
 implementation 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
 implementation 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
 implementation 'thedarkcolour:kotlinforforge-neoforge:5.9.0'
 compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
 runtimeOnly 'dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar {
 from('LICENSE'); from('NOTICE')
 exclude 'dev/danelord/createaero/testing/**'
 exclude 'data/aero_enchant_compat/structure/**'
}
tasks.withType(AbstractArchiveTask).configureEach {
 preserveFileTimestamps = false
 reproducibleFileOrder = true
}
